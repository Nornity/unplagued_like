name: Windows EXE

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  export:
    runs-on: windows-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 and Windows templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import project
        shell: pwsh
        run: godot --headless --path . --editor --quit

      - name: Export Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $output = Join-Path $env:GITHUB_WORKSPACE "release\TheLastBell.exe"
          godot --headless --path . --export-release "Windows Desktop" $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path $output)) {
            Get-ChildItem -Path . -Filter *.exe -Recurse
            Write-Output "::error title=EXE missing::Godot exited successfully but did not create $output"
            exit 1
          }
          Get-Item $output | Format-List FullName, Length

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TheLastBell-Windows
          path: release/TheLastBell.exe
          if-no-files-found: error
