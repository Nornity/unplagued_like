name: Windows EXE

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  export:
    runs-on: windows-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 and Windows templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import and validate project scripts
        shell: pwsh
        run: |
          $godot = Get-ChildItem "$env:USERPROFILE\godot\Godot_v4.7.2-stable_win64.exe"
$PSNativeCommandUseErrorActionPreference = $false
			$output = & $godot.FullName --headless --path . --editor --quit 2>&1
			$code = $LASTEXITCODE
			$details = ($output | Out-String)
			$details | Write-Host
			if ($code -ne 0 -or $details -match "SCRIPT ERROR|Parse Error|Failed to load script") {
				$summary = $details -replace "%", "%25" -replace "`r", "%0D" -replace "`n", "%0A"
				Write-Output "::error title=Godot script validation failed::$summary"
				exit 1
			}

      - name: Export Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $godot = Get-ChildItem "$env:USERPROFILE\godot\Godot_v4.7.2-stable_win64.exe"
          $output = Join-Path $env:GITHUB_WORKSPACE "release\TheLastBell.exe"
          & $godot.FullName --headless --path . --export-release "Windows Desktop" $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path $output)) {
            Get-ChildItem -Path . -Filter *.exe -Recurse
            Write-Output "::error title=EXE missing::Godot exited successfully but did not create $output"
            exit 1
          }
          Get-Item $output | Format-List FullName, Length

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TheLastBell-Windows
          path: release/TheLastBell.exe
          if-no-files-found: error
