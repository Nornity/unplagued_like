name: Windows EXE

on:
  workflow_dispatch:
  push:

jobs:
  export:
    runs-on: windows-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 and Windows templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import project
        shell: pwsh
        run: godot --headless --path . --editor --quit

      - name: Export Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          godot --headless --path . --export-release "Windows Desktop" "$env:GITHUB_WORKSPACE\release\TheLastBell.exe"
          Get-ChildItem release -Force
          if (!(Test-Path "$env:GITHUB_WORKSPACE\release\TheLastBell.exe")) {
            Get-ChildItem -Path . -Filter *.exe -Recurse
            throw "Godot reported success but did not create release/TheLastBell.exe"
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TheLastBell-Windows
          path: release/TheLastBell.exe
          if-no-files-found: error
